<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DWI Práctica de Laboratorio</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Práctica de Laboratorio DWI</h1>
</header>

<nav>
  <button class="nav-btn active" data-destino="edad">Calculadora de edad</button>
  <button class="nav-btn" data-destino="temperatura">Convertidor de temperatura</button>
  <button class="nav-btn" data-destino="tareas">Gestor de tareas</button>
</nav>

<main>

  <section id="edad" class="section active">
    <h2>Calculadora de edad</h2>
    <label>Ingresa tu fecha de nacimiento:</label>
    <div class="date-row">
      <select id="dia"></select>
      <select id="mes"></select>
      <select id="anio"></select>
    </div>
    <button class="action" id="btnCalcularEdad">Calcular</button>
    <div id="resultadoEdad"></div>
  </section>

  <section id="temperatura" class="section">
    <h2>Convertidor de temperatura</h2>
    <label>Ingresa la temperatura, selecciona las unidades y pulsa convertir</label>
    <input type="number" id="valorTemp" placeholder="0.00">
    <label>Unidad de origen</label>
    <select id="unidadOrigen">
      <option value="">Selecciona</option>
      <option value="C">Celsius</option>
      <option value="F">Fahrenheit</option>
      <option value="K">Kelvin</option>
    </select>
    <label>Unidad de destino</label>
    <select id="unidadDestino">
      <option value="">Selecciona</option>
      <option value="C">Celsius</option>
      <option value="F">Fahrenheit</option>
      <option value="K">Kelvin</option>
    </select>
    <button class="action" id="btnConvertir" disabled>Convertir</button>
    <div id="resultadoTemp"></div>
  </section>

  <section id="tareas" class="section">
    <h2>Gestor de tareas</h2>
    <div class="task-input-row">
      <input type="text" id="entradaTarea" placeholder="Escribe y presiona Enter para crear una tarea">
      <button id="btnAgregarTarea">Agregar</button>
    </div>
    <ul id="listaTareas"></ul>
  </section>

</main>

<script src="js/nav.js"></script>
<script src="js/edadCalculadora.js"></script>
<script src="js/tempConvertir.js"></script>
<script src="js/tareasTracker.js"></script>
</body>
</html>
