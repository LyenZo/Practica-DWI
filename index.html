<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DWI Práctica de Laboratorio</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Práctica de Laboratorio DWI</h1>
</header>

<nav>
  <button class="nav-btn active" data-target="age">Calculadora de edad</button>
  <button class="nav-btn" data-target="temp">Convertidor de temperatura</button>
  <button class="nav-btn" data-target="tasks">Gestor de tareas</button>
</nav>

<main>

  <section id="age" class="section active">
    <h2>Calculadora de edad</h2>
    <label>Ingresa tu fecha de nacimiento:</label>
    <div class="date-row">
      <select id="day"></select>
      <select id="month"></select>
      <select id="year"></select>
    </div>
    <button class="action" id="ageBtn">Calcular</button>
    <div id="ageResult"></div>
    <h3>Ugalde Zarza Marcos Jesús IDGS - 91 09/07/2026</h3>
  </section>

  <section id="temp" class="section">
    <h2>Convertidor de temperatura</h2>
    <label>Ingresa la temperatura, selecciona las unidades y pulsa convertir</label>
    <input type="number" id="tempValue" placeholder="0.00">
    <label>Unidad de origen</label>
    <select id="fromUnit">
      <option value="">Selecciona</option>
      <option value="C">Celsius</option>
      <option value="F">Fahrenheit</option>
      <option value="K">Kelvin</option>
    </select>
    <label>Unidad de destino</label>
    <select id="toUnit">
      <option value="">Selecciona</option>
      <option value="C">Celsius</option>
      <option value="F">Fahrenheit</option>
      <option value="K">Kelvin</option>
    </select>
    <button class="action" id="convertBtn" disabled>Convertir</button>
    <div id="tempResult"></div>
    <h3>Ugalde Zarza Marcos Jesús IDGS - 91 09/07/2026</h3>
  </section>

  <section id="tasks" class="section">
    <h2>Gestor de tareas</h2>
    <div class="task-input-row">
      <input type="text" id="taskInput" placeholder="Escribe y presiona Enter para crear una tarea">
      <button id="addTaskBtn">Agregar</button>
    </div>
    <ul id="taskList"></ul>
    <h3>Ugalde Zarza Marcos Jesús IDGS - 91 09/07/2026</h3>
  </section>
  
</main>

<script src="js/nav.js"></script>
<script src="js/edadCalculadora.js"></script>
<script src="js/tempConvertir.js"></script>
<script src="js/tareasTracker.js"></script>
</body>
</html>
